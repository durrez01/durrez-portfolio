     and no JS, so headless screenshots verify the responsive rules instantly. -->

<body class="static-page" data-boot="done" data-chapter="hero">
<main>
<section id="hero" class="panel hero-panel" aria-labelledby="hero-title">
  <h1 id="hero-title">A system behind every screen.</h1>
</section>
</main>
<script>
addEventListener('load',()=>{const h=document.getElementById('hero-title'),c=getComputedStyle(h),r=h.getBoundingClientRect();
document.title=`fs=${c.fontSize} ws=${c.whiteSpace} l=${Math.round(r.left)} r=${Math.round(r.right)} vw=${innerWidth}`;});
</script>
</body>
